if {[info exists ::env(STM32_OPENOCD_SCRIPTS)]} {
  add_script_search_dir $::env(STM32_OPENOCD_SCRIPTS)
}

foreach script_dir [glob -nocomplain "/Applications/STM32CubeIDE.app/Contents/Eclipse/plugins/com.st.stm32cube.ide.mcu.debug.openocd_*/resources/openocd/st_scripts"] {
  add_script_search_dir $script_dir
}

source [file join [file dirname [info script]] l010f4p6.cfg]

if {[info exists _TARGETNAME]} {
  $_TARGETNAME configure -event gdb-attach {}
}
